# Development flavor: stamped at build time by the Android build pipeline from
# the development environment's provisioned infrastructure (see
# .github/workflows/android-build.yml). Empty values fail closed with a clear
# ConfigLoader error.
APP_NAME=
GRAPHQL_URL=
AUTH_MODE=builtin
AUTH_METHODS=email-code
AUTH_REDIRECT_URL=baseapp-dev://auth/callback
# The deployed web app's origin; payments checkout/portal redirect URLs are
# built from it. Stamped at build time like GRAPHQL_URL; empty disables the
# billing surfaces (they report billing unavailable).
WEB_ORIGIN=
# Device update channel for sideloaded APK builds: the platform stamps a
# per-build check URL here; the installed app polls it on launch and offers
# newer builds in-app (see update/UpdateChannel.kt). Empty disables the
# updater (emulator and store builds update through their own channels).
UPDATE_CHANNEL_URL=
# FCM client identity for push notifications, stamped at build time like
# GRAPHQL_URL (the kernel cannot commit a tenant google-services.json;
# FirebaseApp is initialized programmatically from these). All four must be
# present or push is unavailable and the Notifications card hides itself.
FCM_PROJECT_ID=
FCM_APPLICATION_ID=
FCM_API_KEY=
FCM_SENDER_ID=
