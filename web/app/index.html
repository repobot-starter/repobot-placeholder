<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Pre-hydration fallback only: after render the SEO kernel owns the
             title and all document meta — pages declare it via <PageMeta>
             (docs/seo.md). Don't add per-page meta tags here. -->
        <title>Spaceboy</title>
        <!-- Identity marker: the brief runner (scripts/brief/check.mjs) verifies
             this app answers on its base URL before running page assertions. -->
        <meta name="repobot-app" content="repobot-base" />
        <!-- Default Spaceboy favicon; brand:generate (or replacing the files in
             public/) rebrands a project with its own marks. -->
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <!-- The jacaranda register's sign-painter kit (show-card caps, brush
             script, storefront grotesk body), schematic's wide extended
             display, and sunbelt's fat 70s display + sign script. -->
        <link
            href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Kaushan+Script&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Unbounded:wght@500..900&family=Bagel+Fat+One&family=Sacramento&display=swap"
            rel="stylesheet"
        />
        <!-- The riso register's condensed poster caps + body, and the paintchip register's tight grotesk. -->
        <link
            href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter+Tight:wght@500..900&display=swap"
            rel="stylesheet"
        />
        <!-- The crown register's width-axis grotesk (expanded masthead, condensed cover lines) and the vanity register's Didone + geometric caps. -->
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,700..900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Jost:wght@300..600&display=swap"
            rel="stylesheet"
        />
        <!-- The disco register's supper-club kit: a high-contrast Didone, a
             deco geometric sans, and a swashy script. -->
        <link
            href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Josefin+Sans:wght@300..700&family=Great+Vibes&display=swap"
            rel="stylesheet"
        />
        <!-- The care family's registers: wayfinding's width-axis sign grotesk,
             groove's fat 70s sleeve display + text serif, inkblot's display
             Garamond pair, and bubblegum's balloon display, round body, and
             ballpoint script. -->
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,100,500&family=Caprasimo&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Cormorant:ital,wght@0,400..700;1,400..700&family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=Modak&family=Outfit:wght@400..800&family=Yellowtail&display=swap"
            rel="stylesheet"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&family=VT323&family=Nunito:wght@600;700;800&family=Press+Start+2P&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
