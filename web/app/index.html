<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Pre-hydration fallback only: after render the SEO kernel owns the
             title and all document meta — pages declare it via <PageMeta>
             (docs/seo.md). Don't add per-page meta tags here. -->
        <title>Spaceboy</title>
        <!-- Identity marker: the brief runner (scripts/brief/check.mjs) verifies
             this app answers on its base URL before running page assertions. -->
        <meta name="repobot-app" content="repobot-base" />
        <!-- Default Spaceboy favicon; brand:generate (or replacing the files in
             public/) rebrands a project with its own marks. -->
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&family=VT323&family=Nunito:wght@600;700;800&family=Press+Start+2P&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
