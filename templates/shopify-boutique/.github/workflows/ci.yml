# Theme CI: lint main with Theme Check. This is the repobot standards gate
# for Shopify projects (the equivalent of typecheck+tests on web projects).
# Main-only: promotions merge without waiting on GitHub checks (the pod's
# kernel checks gate the merge), so PR-triggered runs were pure spend.
name: ci

on:
    push:
        branches: [main]

jobs:
    theme-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - run: npm ci || npm install
            - run: npx shopify theme check --fail-level error
