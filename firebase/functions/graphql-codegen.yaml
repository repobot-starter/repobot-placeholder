# Generates resolver types from the GraphQL SDL (copied into generated/Graphql
# by prebuild.sh). Root resolvers return PartiallyResolved rows; field resolvers
# hydrate relations through per-request dataloaders.
schema: "./generated/Graphql/**/*.gql"
generates:
    ./generated/GraphqlResolverTypes.ts:
        plugins:
            - "typescript"
            - "typescript-resolvers"
        config:
            useIndexSignature: true
            contextType: "../src/Graphql/GraphqlServer.js#GraphqlRequestContext"
            maybeValue: "T | undefined"
            inputMaybeValue: "T | null | undefined"
            typesPrefix: "Gql"
            enumsAsTypes: true
            scalars:
                Id: "string"
                Instant: "Date | string"
            mappers:
                Account: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedAccount"
                User: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedUser"
                Project: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedProject"
                ProjectMembership: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedProjectMembership"
                CheckoutSession: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedCheckoutSession"
                Purchase: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedPurchase"
                PaymentSubscription: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedPaymentSubscription"
                QuickBooksConnection: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedQuickBooksConnection"
                Upload: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedUpload"
                PushDevice: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedPushDevice"
                CfoMembership: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedCfoMembership"
                CfoInvite: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedCfoInvite"
                CfoClient: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedCfoClient"
                CreditLc: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedCreditLc"
                CreditDocument: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedCreditDocument"
                FlowTemplate: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedFlowTemplate"
                FlowLine: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedFlowLine"
                PitchDeck: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedPitchDeck"
                PitchSlide: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedPitchSlide"
                EntryField: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedEntryField"
                EntryRecord: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedEntryRecord"
                Song: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedSong"
                DriveEntry: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedDriveEntry"
                DriveAlbum: "../src/Graphql/Resolvers/PartiallyResolved.js#PartiallyResolvedDriveAlbum"
